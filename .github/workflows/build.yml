name: Native fixture builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Publisher dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libssl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev wayland-protocols xvfb weston openbox xdotool zenity libglib2.0-bin
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DOBK_FIXTURE_BUILD=ON
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DOBK_FIXTURE_BUILD=ON
      - name: Build
        run: cmake --build build/ci --config MinSizeRel --parallel 2
      - name: Test
        run: ctest --test-dir build/ci -C MinSizeRel --output-on-failure --output-junit results.xml
      - name: Install
        run: cmake --install build/ci --config MinSizeRel --prefix dist
      - name: Linux display and library audit
        if: runner.os == 'Linux'
        run: |
          python tests/integration/linux_displays.py dist/OpenBK2Launcher-Linux-x64 build/ci/fixture_game --backend x11
          python tests/integration/linux_displays.py dist/OpenBK2Launcher-Linux-x64 build/ci/fixture_game --backend wayland
          python tools/audit_binary.py dist/OpenBK2Launcher-Linux-x64 --out build/ci/binary-audit.json
          readelf --version-info dist/OpenBK2Launcher-Linux-x64 > build/ci/symbol-versions.txt
      - name: Windows library audit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbinPath = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1 -ExpandProperty FullName
          python tools/audit_binary.py dist/OpenBK2Launcher-Windows-x64.exe --dumpbin "$dumpbinPath" --out build/ci/binary-audit.json
      - name: Archive fixture artifacts and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-${{ matrix.os }}
          path: |
            dist/
            build/ci/results.xml
            build/ci/Testing/Temporary/LastTest.log
            build/ci/binary-audit.*
            build/ci/symbol-versions.txt
            build/display-artifacts/
            build/lifecycle-artifacts/
            THIRD_PARTY_NOTICES.md
            licenses/
